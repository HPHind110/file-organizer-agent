<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>File Organizer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#202c28;font:15px/1.55 "Segoe UI",sans-serif}header{background:#183e34;color:white;padding:16px max(5vw,20px);display:flex;align-items:center;justify-content:space-between}header b{font-size:20px}header small{font-family:monospace;color:#c4d9ca}main{max-width:1250px;margin:auto;padding:38px 5vw}h1{font:normal clamp(36px,5vw,60px)/1.1 Georgia,serif;margin:0 0 10px}h2{font-size:19px;margin:0 0 12px}button,select,input{font:inherit}button,select{border:1px solid #b7c6bc;background:white;color:#183e34;border-radius:7px;padding:8px 14px;cursor:pointer}button.primary{background:#24684c;color:white;border-color:#24684c}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.panel,article{background:#fff;border:1px solid #d7ded4;border-radius:12px;padding:20px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}article strong{display:block;font:36px Georgia;color:#175438}article span,small{color:#54645a}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e0e6df;vertical-align:top}th{color:#4d6054}#path{overflow-wrap:anywhere;font-family:monospace}#status{padding:10px 0;min-height:40px;color:#225841}#status.error{color:#982b20}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#e8efdf;border-radius:5px;padding:3px 9px}details{padding:9px 0;border-bottom:1px solid #ddd}summary{cursor:pointer}dialog{border:0;border-radius:12px;max-width:min(520px,90vw);padding:26px}dialog::backdrop{background:#10282088}button:focus-visible,select:focus-visible{outline:3px solid #ce9744}@media(max-width:600px){main{padding:22px 12px}.panel,article{padding:12px}.stats{gap:5px}article strong{font-size:25px}}
</style><header><b>▧ &nbsp; File Organizer</b><small>LOCAL / WINDOWS</small></header><main><h1>Không gian tệp</h1><div id="path">Đang kết nối…</div>
<div class="panel row"><button id="pick">Chọn thư mục…</button><label><input type="checkbox" id="deep"> Quét cả thư mục con</label><button class="primary" id="scan">Quét và xem trước</button></div><div id="status" role="status"></div>
<div class="stats"><article><span>Tệp đã đọc</span><strong id="files">—</strong></article><article><span>Dung lượng đã đọc</span><strong id="size">—</strong></article><article><span>Đề xuất di chuyển</span><strong id="moves">—</strong></article></div>
<section class="panel"><h2>Kế hoạch sắp xếp</h2><div class="chips" id="categories"></div><div class="scroll"><table><thead><tr><th>Tệp nguồn</th><th>Kích thước</th><th>Đích đề xuất</th><th>Trạng thái · Lý do</th></tr></thead><tbody id="items"></tbody></table></div><p id="empty">Quét thư mục để xem kế hoạch.</p><button id="execute" disabled>Duyệt di chuyển…</button></section>
<section class="panel"><div class="row"><h2>Lịch sử thao tác</h2><button id="refresh">Làm mới</button></div><div id="history"></div></section>
<dialog id="modal"><h2 id="title"></h2><p id="message"></p><div class="row"><button id="cancel" autofocus>Hủy</button><button id="confirm" class="primary">Xác nhận</button></div></dialog></main>
<script>
const el=id=>document.getElementById(id);
let token=location.hash.slice(1)||sessionStorage.getItem('access')||'';
history.replaceState(null,'',location.pathname);
if(!token)token=prompt('Nhập Bearer token của server để mở dashboard')||'';
sessionStorage.setItem('access',token);
let workspace,plan,busy=false,pending;
function note(s,error=false){el('status').textContent=s;el('status').className=error?'error':''}
function buttons(){for(const b of document.querySelectorAll('main button'))b.disabled=busy;el('pick').disabled=busy||!workspace?.picker;el('scan').disabled=busy||!workspace;el('execute').disabled=busy||!plan?.items.some(i=>i.status==='move')}
async function task(label,fn){if(busy)return;busy=true;buttons();note(label);try{note(await fn()||'Hoàn tất.')}catch(e){note(e.message,true)}finally{busy=false;buttons()}}
async function api(path,body,post=false){const r=await fetch(path,{method:body||post?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(r.status+' · '+JSON.stringify(data.detail));return data}
function node(tag,s){const n=document.createElement(tag);n.textContent=s;return n}
function bytes(n){return new Intl.NumberFormat('vi').format(n)+' B'}
function render(){const rows=plan?.items||[],groups=new Map();let count=0,total=0;el('items').replaceChildren();for(const i of rows){if(i.snapshot){count++;total+=i.snapshot.size;const g=i.target?.split('/')[1]||'Chưa phân loại';groups.set(g,(groups.get(g)||0)+1)}const tr=node('tr','');for(const v of [i.source,i.snapshot?bytes(i.snapshot.size):'—',i.target||'—',i.status+' · '+i.reason])tr.append(node('td',v));el('items').append(tr)}el('files').textContent=plan?count:'—';el('size').textContent=plan?bytes(total):'—';el('moves').textContent=plan?rows.filter(i=>i.status==='move').length:'—';el('empty').textContent=plan?(rows.length?'':'Thư mục không có mục để xử lý.'):'Quét thư mục để xem kế hoạch.';el('categories').replaceChildren(...Array.from(groups,([g,n])=>{let s=node('span',g+' · '+n);s.className='chip';return s}));buttons()}
function ask(title,message,fn){pending=fn;el('title').textContent=title;el('message').textContent=message;el('modal').showModal();el('cancel').focus()}
el('cancel').onclick=()=>el('modal').close();el('confirm').onclick=()=>{el('modal').close();pending()}
async function logs(){const runs=await api('/operations');el('history').replaceChildren();if(!runs.length)el('history').append(node('p','Chưa có lần thực thi nào.'));for(const r of runs){const d=node('details','');d.append(node('summary',new Date(r.started).toLocaleString('vi')+' · '+Object.entries(r.counts).map(([k,v])=>v+' '+k).join(', ')));d.ontoggle=async()=>{if(!d.open||d.dataset.loaded)return;try{const data=await api('/operations/'+r.id);for(const m of data.moves)d.append(node('div',m.state+' · '+m.src+' → '+m.dst+' '+m.detail));d.dataset.loaded='1'}catch(e){note(e.message,true)}};if(Object.keys(r.counts).some(k=>!['restored','skipped'].includes(k))){let b=node('button','Hoàn tác…');b.onclick=()=>ask('Hoàn tác lần chạy này?',workspace.directory+' · '+r.id,()=>mutate('/operations/'+r.id+'/rollback','restored'));d.append(b)}el('history').append(d)}}
function mutate(path,wanted){task('Đang xử lý tệp…',async()=>{const data=await api(path,{approved:true});plan=null;render();await logs();const unresolved=data.moves.filter(m=>m.state!==wanted && !(wanted==='restored'&&m.state==='skipped'));if(unresolved.length)throw Error(unresolved.length+' thao tác chưa hoàn tất. Mở lịch sử để xem chi tiết.');return 'Hoàn tất · '+data.moves.filter(m=>m.state===wanted).length+' '+wanted})}
el('execute').onclick=()=>ask('Di chuyển '+el('moves').textContent+' tệp?',workspace.directory+' — Các tệp MOVE trong bảng sẽ được chuyển đến đường dẫn đích đã hiển thị.',()=>mutate('/plans/'+plan.plan_id+'/execute','moved'));
el('deep').onchange=()=>{plan=null;render()};el('scan').onclick=()=>task('Đang đọc và phân loại tệp…',async()=>{plan=null;render();plan=await api('/plans',{directory:workspace.directory,recursive:el('deep').checked});render();return 'Đã quét xong. Kiểm tra đích trước khi duyệt.'});
async function load(pick=false){workspace=await api(pick?'/workspace/pick':'/workspace',null,pick);el('path').textContent=workspace.directory;plan=null;render();await logs();return 'Thư mục đã sẵn sàng.'}
el('pick').onclick=()=>task('Chọn thư mục trong cửa sổ Windows…',()=>load(true));el('refresh').onclick=()=>task('Đang tải lịch sử…',logs);task('Đang kết nối…',()=>load());
</script></html>
